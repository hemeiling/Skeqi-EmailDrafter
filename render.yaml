services:
  - type: web
    name: skeqi-emaildrafter
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL          # Neon Postgres connection string (…?sslmode=require)
        sync: false
      - key: CLAUDE_API_KEY        # Anthropic API key (sk-ant-…)
        sync: false
      - key: APOLLO_API_KEY        # Apollo.io API key
        sync: false
      # Credential the inbound-reply connector presents. Its only power is to
      # OFFER a candidate reply: anything not answering a CRM-sent message is
      # discarded, so this grants no mailbox or read access.
      - key: REPLY_INGEST_TOKEN    # forwarding connector token
        sync: false
      - key: APP_USERNAME          # HTTP Basic Auth username for the app login gate
        sync: false
      - key: APP_PASSWORD          # HTTP Basic Auth password
        sync: false
      # Optional — only needed for Microsoft 365 / Google *OAuth* sign-in.
      # The SMTP providers (GoDaddy, NetEase, Custom) do NOT need these.
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
