services:
  - type: web
    name: skeqi-emaildrafter
    env: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      # Secrets — set these in the Render dashboard (never committed).
      - key: DATABASE_URL          # Neon Postgres connection string (…?sslmode=require)
        sync: false
      - key: CLAUDE_API_KEY        # Anthropic API key (sk-ant-…)
        sync: false
      # Email drafting. Bailian/Qwen is the default writer; GPT and Claude are
      # selectable alternatives. All values are set in the dashboard, never here.
      # Without these three, Qwen is simply not offered and drafting falls back
      # to whichever provider IS configured.
      - key: BAILIAN_API_KEY       # Bailian (Qwen) API key
        sync: false
      - key: BAILIAN_BASE_URL      # OpenAI-compatible base, e.g. …/compatible-mode/v1
        sync: false
      - key: BAILIAN_EMAIL_MODEL   # qwen3.6-flash
        sync: false
      - key: OPENAI_API_KEY        # OpenAI key — offers GPT as a premium option
        sync: false
      - key: APOLLO_API_KEY        # Apollo.io API key
        sync: false
      # Credential the inbound-reply connector presents. Its only power is to
      # OFFER a candidate reply: anything not answering a CRM-sent message is
      # discarded, so this grants no mailbox or read access.
      - key: REPLY_INGEST_TOKEN    # forwarding connector token
        sync: false
      # Standalone Account Research app (separate Render service). A URL, not a
      # secret, but it differs per environment so it is never hardcoded.
      - key: CURRENT_ACCOUNT_RESEARCH_URL
        sync: false
      - key: ACCOUNT_RESEARCH_SERVICE_KEY   # must match APP_SERVICE_KEY on that service
        sync: false
      - key: ACCOUNT_RESEARCH_TIMEOUT_MS    # optional; research runs are slow
        value: "600000"
      - key: APP_USERNAME          # HTTP Basic Auth username for the app login gate
        sync: false
      - key: APP_PASSWORD          # HTTP Basic Auth password
        sync: false
      # Optional — only needed for Microsoft 365 / Google *OAuth* sign-in.
      # The SMTP providers (GoDaddy, NetEase, Custom) do NOT need these.
      - key: MS_CLIENT_ID
        sync: false
      - key: MS_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
