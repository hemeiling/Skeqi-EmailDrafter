<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Battery Show 2026 — 思客琦展位图</title>
<style>
/* ══════════════════════════════════════════════════════════════════════
   Booth Map — SKQ CRM design system
   This module lives inside the CRM shell, so its chrome uses the same
   tokens, components, spacing and type scale as every other page. The
   only thing that stays on its own terms is the <canvas> itself: it is
   the visualization, and its booth colours carry data meaning.
   ══════════════════════════════════════════════════════════════════════ */
:root{
  --color-primary:#4E2A84; --color-primary-hover:#3D1E6E;
  --color-primary-soft:#EDE9F7; --color-primary-border:#CFC4E8;
  --color-accent:#0F6CBD; --color-success:#198754; --color-danger:#DC3545; --color-warn:#F4B400;
  --color-bg:#F7F7F7; --color-surface:#FFFFFF; --color-surface-alt:#FAFAFB;
  --color-border:#E5E5EA; --color-border-soft:#F0F0F3;
  --color-text:#1F2937; --color-text-secondary:#4B5563; --color-text-tertiary:#6B7280;
  --radius-sm:6px; --radius-md:8px; --radius-lg:12px; --radius-full:999px;
  --shadow-xs:0 1px 2px rgba(16,24,40,0.05);
  --shadow-sm:0 1px 3px rgba(16,24,40,0.08),0 1px 2px rgba(16,24,40,0.04);
  --shadow-md:0 4px 10px rgba(16,24,40,0.08),0 2px 4px rgba(16,24,40,0.04);
  --shadow-lg:0 12px 32px rgba(16,24,40,0.14);
  --font-sans:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  font-family:var(--font-sans); background:var(--color-surface); color:var(--color-text);
  height:100vh; display:flex; flex-direction:column; overflow:hidden;
}

/* ── Toolbar ────────────────────────────────────────────────────────────
   Not a page header — the CRM top bar already names this page. This is a
   module toolbar, styled like the CRM's other card headers. */
.topbar{
  padding:13px 18px; display:flex; align-items:center; gap:12px;
  background:var(--color-surface); border-bottom:1px solid var(--color-border);
  flex-shrink:0; flex-wrap:wrap;
}
.topbar h1{
  font-size:0.85rem; font-weight:600; text-transform:uppercase; letter-spacing:0.06em;
  color:#555; white-space:nowrap; display:flex; align-items:center; gap:8px;
}
.topbar input{
  padding:7px 12px 7px 32px; border:1px solid var(--color-border); border-radius:var(--radius-full);
  background:var(--color-surface-alt); color:var(--color-text); font-size:0.82rem;
  outline:none; width:230px; font-family:inherit;
  transition:border-color .15s, box-shadow .15s, background .15s;
}
.topbar input::placeholder{color:var(--color-text-tertiary)}
.topbar input:focus{
  border-color:var(--color-primary); background:var(--color-surface);
  box-shadow:0 0 0 3px rgba(78,42,132,0.1);
}
.bm-search{position:relative;flex-shrink:0}
.bm-search::before{
  content:"🔎"; position:absolute; left:11px; top:50%; transform:translateY(-50%);
  font-size:0.78rem; opacity:.5; pointer-events:none;
}
/* Header stat pills — same chip vocabulary as the dashboard. */
.bm-stats{display:flex;align-items:center;gap:8px;margin-left:auto;flex-wrap:wrap}
.bm-pill{
  display:inline-flex; align-items:center; gap:6px; padding:5px 11px;
  border-radius:var(--radius-full); font-size:0.74rem; font-weight:600;
  background:var(--color-surface-alt); border:1px solid var(--color-border);
  color:var(--color-text-secondary); white-space:nowrap;
}
.bm-pill b{font-weight:800;color:var(--color-text);font-size:0.8rem}
.bm-pill.is-primary{background:var(--color-primary-soft);border-color:var(--color-primary-border);color:var(--color-primary-hover)}
.bm-pill.is-primary b{color:var(--color-primary-hover)}
.bm-pill.is-blue{background:#E4F0FA;border-color:#BCD9F0;color:#0C579A}
.bm-pill.is-blue b{color:#0C579A}
.bm-pill.is-red{background:#FCEBED;border-color:#F3B7BE;color:#A21D2A}
.bm-pill.is-red b{color:#A21D2A}
.bm-pill.is-green{background:#E8F3EE;border-color:#A9D5C0;color:#0F5132}
.bm-pill.is-green b{color:#0F5132}
#theme-btn{display:none}

/* ── Filter rail ── mirrors the CRM's #crm-sidebar panel. */
/* The rail holds the category list and, when a category is picked, the
   matching company list expands underneath it — no second panel over the map. */
.filterbar{
  display:flex; flex-direction:column; gap:2px; padding:12px 10px 0;
  background:var(--color-surface-alt); border-right:1px solid var(--color-border);
  flex-shrink:0; overflow:hidden; width:212px; z-index:5;
  transition:width .18s ease;
}
.filterbar.expanded{ width:318px; }
/* Only the category list scrolls while collapsed; once expanded it shrinks so
   the company list gets the room. */
#fb{ overflow-y:auto; padding-bottom:12px; }
.filterbar.expanded #fb{ max-height:186px; flex-shrink:0; }
#rpanel{
  flex:1; min-height:0; margin:0 -10px; border-top:1px solid var(--color-border);
  background:var(--color-surface);
}
.fb-heading{
  font-size:0.68rem; font-weight:700; color:var(--color-text-tertiary);
  text-transform:uppercase; letter-spacing:.05em; padding:0 6px; margin-bottom:8px;
}
/* A filter row reads like a CRM list item: colour dot (ties to the canvas
   legend), label, count badge. Active state is the app's light-purple pill. */
.fb{
  display:flex; align-items:center; gap:9px; width:100%; text-align:left;
  padding:7px 9px; border-radius:var(--radius-md); border:1px solid transparent;
  background:transparent; color:var(--color-text-secondary); font-family:inherit;
  font-size:0.78rem; font-weight:500; cursor:pointer; white-space:nowrap;
  transition:background .12s, color .12s;
}
.fb:hover{background:var(--color-border-soft); color:var(--color-text)}
.fb.on{background:var(--color-primary-soft); color:var(--color-primary-hover); font-weight:650}
.fb-dot{width:9px;height:9px;border-radius:3px;flex-shrink:0}
.fb-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.fb-zh{display:block;font-size:0.66rem;font-weight:400;color:var(--color-text-tertiary);margin-top:1px}
.fb.on .fb-zh{color:var(--color-primary)}
.fb-cnt{
  flex-shrink:0; font-size:0.66rem; font-weight:700; padding:1px 7px;
  border-radius:var(--radius-full); background:var(--color-border-soft); color:var(--color-text-tertiary);
}
.fb.on .fb-cnt{background:rgba(78,42,132,.14); color:var(--color-primary-hover)}

/* ── Canvas surface ── the visualization keeps its own dark ground; it is
   framed as a deliberate data surface rather than a second application. */
.wrap{overflow:hidden;position:relative;cursor:grab;background:#0d1117}
.wrap.drag{cursor:grabbing}
#cv{position:absolute;top:0;left:0}

/* Zoom cluster — CRM ghost buttons. */
.zc{position:absolute;bottom:16px;right:16px;display:flex;flex-direction:column;gap:5px;z-index:10}
.zb{
  width:30px;height:30px;border-radius:var(--radius-md);
  border:1px solid var(--color-border); background:var(--color-surface);
  color:var(--color-text-secondary); font-size:15px; cursor:pointer;
  display:flex;align-items:center;justify-content:center; box-shadow:var(--shadow-sm);
  transition:background .12s,border-color .12s,color .12s;
}
.zb:hover{background:var(--color-primary-soft);border-color:var(--color-primary-border);color:var(--color-primary)}

/* Hover tooltip — CRM card. */
.tip{
  position:absolute; background:var(--color-surface); border:1px solid var(--color-border);
  border-left:3px solid var(--color-primary); border-radius:var(--radius-lg);
  padding:10px 13px; font-size:0.8rem; pointer-events:none; z-index:20; max-width:280px;
  transform:translateY(-110%); box-shadow:var(--shadow-lg);
}
.tn{font-size:0.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--color-primary);margin-bottom:4px}
.tm{font-weight:700;color:var(--color-text);line-height:1.35;font-size:0.86rem}
.tz{color:var(--color-text-tertiary);margin-top:2px;font-size:0.78rem}
.tc{font-size:0.68rem;font-weight:600;margin-top:6px;padding:2px 8px;border-radius:var(--radius-full);display:inline-block}
.ti{font-size:0.72rem;color:var(--color-text-tertiary);margin-top:7px;line-height:1.55;border-top:1px solid var(--color-border-soft);padding-top:6px}

/* Help hint — CRM card, floating over the canvas. */
.info{
  position:absolute; top:14px; left:14px; background:var(--color-surface);
  border:1px solid var(--color-border); border-radius:var(--radius-lg);
  padding:11px 14px; font-size:0.74rem; color:var(--color-text-tertiary);
  z-index:10; box-shadow:var(--shadow-sm); line-height:1.6;
}
.info strong{
  color:var(--color-text); font-size:0.72rem; font-weight:700; text-transform:uppercase;
  letter-spacing:.05em; display:block; margin-bottom:5px;
}

/* ── Legend footer ── */
.sbar{
  padding:10px 18px; background:var(--color-surface); font-size:0.72rem;
  color:var(--color-text-tertiary); display:flex; gap:14px; flex-shrink:0;
  border-top:1px solid var(--color-border); align-items:center; flex-wrap:wrap;
}
.li{display:flex;align-items:center;gap:6px;font-size:0.72rem;color:var(--color-text-secondary);font-weight:500}
.ld{width:10px;height:10px;border-radius:3px;flex-shrink:0}
.sbar-hint{margin-left:auto;color:var(--color-text-tertiary);font-size:0.72rem}

/* ── Modal ── CRM dialog. */
.ov{display:none;position:fixed;inset:0;background:rgba(31,41,55,0.45);z-index:100;align-items:center;justify-content:center;padding:16px}
.ov.show{display:flex}
.modal{
  background:var(--color-surface); border:1px solid var(--color-border); border-radius:var(--radius-lg);
  max-width:520px; width:100%; max-height:82vh; overflow-y:auto; position:relative; box-shadow:var(--shadow-lg);
}
.mh{padding:18px 20px 14px;border-bottom:1px solid var(--color-border-soft);position:sticky;top:0;background:var(--color-surface);border-radius:var(--radius-lg) var(--radius-lg) 0 0}
.mn{font-size:0.68rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--color-primary);margin-bottom:4px}
.me{font-size:1.05rem;font-weight:700;color:var(--color-text);line-height:1.3}
.mz{font-size:0.82rem;color:var(--color-text-tertiary);margin-top:3px}
.mcat{display:inline-block;font-size:0.68rem;font-weight:600;padding:3px 9px;border-radius:var(--radius-full);margin-top:8px;color:#fff}
.mb{padding:16px 20px 20px}
.mi{font-size:0.84rem;line-height:1.85;color:var(--color-text-secondary)}
.mt{font-size:0.72rem;color:var(--color-text-tertiary);margin-top:12px;padding-top:12px;border-top:1px solid var(--color-border-soft)}
/* Sits on a white card, so it needs its own fill to be findable at all. */
.mc{
  position:absolute;top:14px;right:16px;width:28px;height:28px;border-radius:50%;
  border:1px solid var(--color-border);background:var(--color-surface-alt);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;
  color:var(--color-text-secondary);z-index:2;
}
.mc:hover{background:var(--color-danger-soft,#FCEBED);border-color:#F3B7BE;color:var(--color-danger)}

/* ── Right detail panel ── CRM side sheet. */
#rpanel{ background:var(--color-surface)!important; }
#rp-head{background:var(--color-surface)!important;border-bottom:1px solid var(--color-border)!important;padding:11px 12px!important}
#rp-title{font-size:0.82rem!important;font-weight:700!important;color:var(--color-text)!important;line-height:1.3}
#rp-sub{font-size:0.72rem!important;color:var(--color-text-tertiary)!important;margin-top:3px!important}
#rp-close{
  border:1px solid var(--color-border)!important;background:var(--color-surface)!important;
  color:var(--color-text-tertiary)!important;width:28px;height:28px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;font-size:14px!important;cursor:pointer;padding:0!important;
}
#rp-close:hover{background:#FCEBED!important;border-color:#F3B7BE!important;color:var(--color-danger)!important}
#rp-searchwrap{background:var(--color-surface)!important;border-bottom:1px solid var(--color-border)!important;padding:8px 12px!important}
#rp-search{
  background:var(--color-surface-alt)!important;border:1px solid var(--color-border)!important;
  color:var(--color-text)!important;border-radius:var(--radius-full)!important;
  padding:7px 12px!important;font-size:0.78rem!important;font-family:inherit!important;
}
#rp-search::placeholder{color:var(--color-text-tertiary)!important}
#rp-search:focus{border-color:var(--color-primary)!important;background:var(--color-surface)!important;box-shadow:0 0 0 3px rgba(78,42,132,.1)!important}
#rp-body{background:var(--color-surface)}

.rp-company{padding:9px 12px;border-bottom:1px solid var(--color-border-soft);cursor:pointer;transition:background .12s}
.rp-company:hover{background:var(--color-surface-alt)}
.rp-company.selected{background:var(--color-primary-soft);border-left:3px solid var(--color-primary)}
.rp-num{font-size:0.62rem;font-weight:700;color:var(--color-text-tertiary);background:var(--color-border-soft);padding:2px 6px;border-radius:var(--radius-sm);margin-right:6px}
.rp-name{font-size:0.82rem;font-weight:600;color:var(--color-text)}
.rp-zh{font-size:0.72rem;color:var(--color-text-tertiary);margin-top:2px}
.rp-tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:6px}
.rp-tag{font-size:0.62rem;font-weight:600;padding:2px 8px;border-radius:var(--radius-full);background:var(--color-primary-soft);color:var(--color-primary-hover)}
.rp-p1{border-left:3px solid var(--color-warn)}
.rp-p2{border-left:3px solid var(--color-accent)}
.rp-p3{border-left:3px solid var(--color-border)}

/* ── Detail sections ── */
.det-section{padding:13px 16px;border-bottom:1px solid var(--color-border-soft)}
.det-label{font-size:0.66rem;font-weight:700;color:var(--color-text-tertiary);text-transform:uppercase;margin-bottom:6px;letter-spacing:.06em}
.det-text{font-size:0.78rem;line-height:1.75;color:var(--color-text-secondary)}
.det-badge{display:inline-block;font-size:0.64rem;font-weight:600;padding:2px 9px;border-radius:var(--radius-full);margin:2px 3px 2px 0}
.det-project{background:var(--color-surface-alt);border:1px solid var(--color-border-soft);border-left:3px solid var(--color-accent);border-radius:var(--radius-md);padding:9px 12px;margin-bottom:6px}
.det-project-text{font-size:0.78rem;color:var(--color-text-secondary);line-height:1.6}
.det-opp{background:#FEF6E0;border:1px solid #F7DC91;border-left:3px solid var(--color-warn);border-radius:var(--radius-md);padding:10px 12px}
.det-opp-text{font-size:0.78rem;color:#6B4E00;line-height:1.65}
.priority-bar{display:flex;align-items:center;gap:9px;padding:11px 16px;border-bottom:1px solid var(--color-border-soft)}

/* Scrollbars, so even the overflow furniture matches the CRM. */
.filterbar::-webkit-scrollbar,#rp-body::-webkit-scrollbar,.modal::-webkit-scrollbar{width:8px}
.filterbar::-webkit-scrollbar-thumb,#rp-body::-webkit-scrollbar-thumb,.modal::-webkit-scrollbar-thumb{background:#D8D8DE;border-radius:4px}
.filterbar::-webkit-scrollbar-thumb:hover,#rp-body::-webkit-scrollbar-thumb:hover,.modal::-webkit-scrollbar-thumb:hover{background:#BFBFC8}
</style>
<div class="topbar">
  <h1>🗺️ Battery Show 2026 · 展位图</h1>
  <div class="bm-search">
    <input type="text" id="sq" placeholder="搜索展商…" oninput="filterBooths()">
  </div>
  <div class="bm-stats">
    <span class="bm-pill is-primary">展商 <b id="sc1">0</b></span>
    <span class="bm-pill is-blue">可用 <b id="sc2">0</b></span>
    <span class="bm-pill is-red">竞品 <b id="sc3">0</b></span>
    <span class="bm-pill is-green">客户 <b id="sc4">0</b></span>
  </div>
</div>
<div style="display:flex;flex:1;overflow:hidden;min-height:0">
<div class="filterbar" id="filterbar"><div class="fb-heading">按类别筛选</div><div id="fb" style="display:flex;flex-direction:column;gap:2px"></div><div id="rpanel" style="display:none;flex-direction:column">
  <div id="rp-head" style="display:flex;justify-content:space-between;align-items:center;flex-shrink:0">
    <div>
      <div id="rp-title"></div>
      <div id="rp-sub"></div>
    </div>
    <button id="rp-close" onclick="closeRP()">✕</button>
  </div>
  <div id="rp-searchwrap" style="flex-shrink:0">
    <input id="rp-search" type="text" placeholder="搜索公司名…" oninput="rpSearchChange(this.value)" style="width:100%;outline:none">
  </div>
  <div id="rp-body" style="overflow-y:auto;flex:1;padding:0"></div>
</div></div>
<div class="wrap" id="wrap" style="flex:1">
  <canvas id="cv"></canvas>
  <div class="tip" id="tip" style="display:none"></div>
  <div class="info"><strong>操作指南</strong>滚轮 / 双指缩放 · 拖拽移动<br>点击展位查看详情</div>
  <div class="zc">
    <button class="zb" onclick="zoom(1.35)">+</button>
    <button class="zb" onclick="zoom(1/1.35)">−</button>
    <button class="zb" onclick="resetView()" style="font-size:11px">⟳</button>
  </div>
</div>
</div>
<div class="sbar" id="sb">
  <div class="li"><div class="ld" style="background:#58a6ff"></div>可用展位</div>
  <div class="li"><div class="ld" style="background:#f85149"></div>直接竞品</div>
  <div class="li"><div class="ld" style="background:#f0883e;border:1px dashed #b8621f"></div>间接竞品</div>
  <div class="li"><div class="ld" style="background:#ffa657"></div>强烈推荐</div>
  <div class="li"><div class="ld" style="background:#3fb950"></div>目标客户</div>
  <div class="li"><div class="ld" style="background:#d2a8ff"></div>ESS/EV 项目</div>
  <div class="li"><div class="ld" style="background:#9198a1"></div>其他</div>
  <span class="sbar-hint">点击展位查看详情</span>
</div>

<!-- Modal -->
<div class="ov" id="ov" onclick="closeModal(event)">
  <div class="modal">
    <button class="mc" onclick="closeModal()">✕</button>
    <div class="mh">
      <div class="mn" id="mn"></div>
      <div class="me" id="me"></div>
      <div class="mz" id="mz"></div>
      <span class="mcat" id="mcat"></span>
    </div>
    <div class="mb"><div id="mbody" class="mi"></div>
      <div class="mt">💡 介绍基于公开资料整理，建议结合展商官网进一步核实。</div>
    </div>
  </div>

let scale=1,ox=0,oy=0,drag=false,ds={x:0,y:0},do_={x:0,y:0};

const BW=8,BH=8;

function isHot(b){const t=(b.nm+' '+(b.zh||'')).toLowerCase();return HOT.some(k=>t.includes(k));}
function getColor(b){
  const av=b.c==='available'||b.nm.toLowerCase().startsWith('available');
  if(av) return '#58a6ff';
  if(DCM[b.n]) return '#f85149';
  if(ICM[b.n]) return '#f0883e';
  if(ESS_EV[b.n]) return '#d2a8ff';
  if(isHot(b)) return '#ffa657';
  return CCOLS[b.c]||'#484f58';
}
function isVis(b){
  if(activeF==='competitor'){
    if(!DCM[b.n]&&!ICM[b.n])return false;
  } else if(activeF==='ess_ev'){
    if(!ESS_EV[b.n])return false;
  } else if(activeF==='chinese'){
    if(!CNM[b.n])return false;
  } else if(activeF!=='all'&&b.c!==activeF){
    return false;
  }
  if(searchT){const t=(b.nm+' '+(b.zh||'')+' '+b.n).toLowerCase();if(!t.includes(searchT))return false;}
  return true;
}

function initCanvas(){

  cv.addEventListener('mousemove',onMM);
  cv.addEventListener('mouseup',()=>{drag=false;wrap.classList.remove('drag');});
  cv.addEventListener('mouseleave',()=>{drag=false;wrap.classList.remove('drag');hovered=null;hideTip();draw();});
  cv.addEventListener('click',onClick);
  cv.addEventListener('touchstart',onTS,{passive:false});

function resize(){cv.width=wrap.clientWidth;cv.height=wrap.clientHeight;draw();}
function resetView(){
  const xs=ALL_BOOTHS_DATA.map(b=>b.x),ys=ALL_BOOTHS_DATA.map(b=>b.y);
  const mnX=Math.min(...xs)-10,mxX=Math.max(...xs)+BW+10,mnY=Math.min(...ys)-10,mxY=Math.max(...ys)+BH+10;
  scale=Math.min(cv.width/(mxX-mnX),cv.height/(mxY-mnY))*0.88;
  ox=(cv.width-(mxX-mnX)*scale)/2-mnX*scale;
  oy=(cv.height-(mxY-mnY)*scale)/2-mnY*scale;
  draw();
}
function zoom(f,cx,cy){
  cx=cx??cv.width/2;cy=cy??cv.height/2;
  const ns=Math.max(0.3,Math.min(12,scale*f));
  ox=cx-(cx-ox)*(ns/scale);oy=cy-(cy-oy)*(ns/scale);scale=ns;draw();
}
function w2s(x,y){return[x*scale+ox,y*scale+oy];}
function s2w(x,y){return[(x-ox)/scale,(y-oy)/scale];}

function draw(){
  if(!ctx||!cv)return;
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#0d1117';ctx.fillRect(0,0,cv.width,cv.height);
  // subtle grid
  ctx.strokeStyle='rgba(255,255,255,0.02)';ctx.lineWidth=1;
  const [wx0]=s2w(0,0),[wx1]=s2w(cv.width,0);
  for(let gx=Math.floor(wx0/100)*100;gx<=wx1+100;gx+=100){const[sx]=w2s(gx,0);ctx.beginPath();ctx.moveTo(sx,0);ctx.lineTo(sx,cv.height);ctx.stroke();}
  // section labels
  if(scale>0.4){
    const sections=[{x:203,label:'Electric & Hybrid'},{x:335,label:'The Battery Show'},{x:585,label:'Battery Tech'}];
    ctx.textAlign='center';ctx.fillStyle='rgba(255,255,255,0.08)';
    sections.forEach(s=>{const[sx,sy]=w2s(s.x,80);ctx.font=`bold ${Math.max(11,16*scale)}px sans-serif`;ctx.fillText(s.label,sx,sy);});
  }
  const bw=BW*scale,bh=BH*scale;
  const vis=[],hid=[];
  ALL_BOOTHS_DATA.forEach(b=>isVis(b)?vis.push(b):hid.push(b));
  // hidden - very dim
  hid.forEach(b=>{
    const[sx,sy]=w2s(b.x,b.y);
    if(sx+bw<0||sx>cv.width||sy+bh<0||sy>cv.height)return;
    ctx.fillStyle='rgba(255,255,255,0.04)';
    ctx.fillRect(sx,sy,bw,bh);
    ctx.strokeStyle='rgba(255,255,255,0.06)';
    ctx.lineWidth=0.5;
    ctx.strokeRect(sx+0.5,sy+0.5,bw-1,bh-1);
  });
  // visible
  vis.forEach(b=>{
    const[sx,sy]=w2s(b.x,b.y);
    if(sx+bw<0||sx>cv.width||sy+bh<0||sy>cv.height)return;
    const color=getColor(b);
    const isAv=b.c==='available'||b.nm.toLowerCase().startsWith('available');
    const isH=hovered&&hovered.n===b.n;
    const isDC=DCM[b.n],isIC=ICM[b.n];
    const edge=Math.max(0.5,Math.min(1,scale*0.7));
    if(isAv){
      ctx.fillStyle=isH?'#388bfd':'rgba(88,166,255,0.22)';
      ctx.fillRect(sx,sy,bw,bh);
      ctx.strokeStyle=isH?'#79c0ff':'#58a6ff';
      ctx.lineWidth=Math.max(1,1.5*scale);
      ctx.strokeRect(sx+0.5,sy+0.5,bw-1,bh-1);
    } else if(isDC||isIC){
      const cc=isDC?'#f85149':'#f0883e';
      ctx.fillStyle=isH?cc+'99':cc+'55';
      ctx.fillRect(sx,sy,bw,bh);
      ctx.strokeStyle=cc;
      ctx.lineWidth=Math.max(1,1.5*scale);
      if(isIC)ctx.setLineDash([3,2]);
      ctx.strokeRect(sx+0.5,sy+0.5,bw-1,bh-1);
      ctx.setLineDash([]);
    } else {
      ctx.fillStyle=isH?lighten(color,0.35):(color+(isHot(b)?'dd':'99'));
      ctx.fillRect(sx,sy,bw,bh);
      ctx.strokeStyle='rgba(0,0,0,0.4)';
      ctx.lineWidth=edge;
      ctx.strokeRect(sx+edge/2,sy+edge/2,bw-edge,bh-edge);
    }
    // booth number only at extreme zoom
    if(scale>3){
      const fs=Math.min(Math.floor(bh*0.55),Math.floor(bw*0.35));
      if(fs>=3){
        ctx.save();ctx.beginPath();ctx.rect(sx+0.5,sy+0.5,bw-1,bh-1);ctx.clip();
        ctx.font=`bold ${fs}px monospace`;
        ctx.fillStyle='rgba(255,255,255,0.9)';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText(b.n,sx+bw/2,sy+bh/2);ctx.restore();
      }
    }
  });
  // search highlight ring
  if(searchT){
    vis.forEach(b=>{
      const[sx,sy]=w2s(b.x,b.y);
      ctx.strokeStyle='#fff';ctx.lineWidth=1.5;
      ctx.strokeRect(sx-1.5,sy-1.5,bw+3,bh+3);
    });
  }
}
function lighten(hex,a){const n=parseInt(hex.replace('#',''),16);const r=Math.min(255,(n>>16)+Math.round(255*a));const g=Math.min(255,((n>>8)&0xff)+Math.round(255*a));const b=Math.min(255,(n&0xff)+Math.round(255*a));return`rgb(${r},${g},${b})`;}

function findAt(cx,cy){

}

let prevMx=0,prevMy=0;
function onMM(e){
  if(drag){ox=do_.x+(e.clientX-ds.x);oy=do_.y+(e.clientY-ds.y);draw();hideTip();return;}
  const b=findAt(e.offsetX,e.offsetY);
  if(b){hovered=b;showTip(b,e.offsetX,e.offsetY);cv.style.cursor='pointer';}
  else{hovered=null;hideTip();cv.style.cursor='grab';}
  if(b!==hovered||e.offsetX!==prevMx||e.offsetY!==prevMy)draw();
  prevMx=e.offsetX;prevMy=e.offsetY;
}
function onWheel(e){e.preventDefault();zoom(e.deltaY<0?1.18:1/1.18,e.offsetX,e.offsetY);}
function onClick(e){

let ltd=0;
function onTS(e){e.preventDefault();if(e.touches.length===1){drag=true;ds={x:e.touches[0].clientX,y:e.touches[0].clientY};do_={x:ox,y:oy};}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;ltd=Math.sqrt(dx*dx+dy*dy);}}
function onTM(e){e.preventDefault();if(e.touches.length===1&&drag){ox=do_.x+(e.touches[0].clientX-ds.x);oy=do_.y+(e.touches[0].clientY-ds.y);draw();}else if(e.touches.length===2){const dx=e.touches[0].clientX-e.touches[1].clientX,dy=e.touches[0].clientY-e.touches[1].clientY;const d=Math.sqrt(dx*dx+dy*dy);const r=cv.getBoundingClientRect();const mx=(e.touches[0].clientX+e.touches[1].clientX)/2-r.left,my=(e.touches[0].clientY+e.touches[1].clientY)/2-r.top;zoom(d/ltd,mx,my);ltd=d;}}

// Filter bar
function buildFB(){
  const counts={all:0,competitor:0,ess_ev:0,chinese:0};
  ALL_BOOTHS_DATA.forEach(b=>{
    counts.all++;
    counts[b.c]=(counts[b.c]||0)+1;
    if(DCM[b.n]||ICM[b.n])counts.competitor++;
    if(ESS_EV[b.n])counts.ess_ev++;
    if(CNM[b.n])counts.chinese++;
  });
  document.getElementById('fb').innerHTML=CATS.map(c=>{
    const on=activeF===c.id;
    const cnt=counts[c.id]||0;
    const parts=c.label.split(' \u00b7 ');
    // Label carries a leading emoji in the data; the colour dot replaces it so
    // every row lines up on the same grid, like the CRM's list components.
    const top=(parts[0]||c.label).replace(/^[^\w(]+\s*/,'');
    const bot=parts[1]||'';
    return `<button class="fb ${on?'on':''}" onclick="setF('${c.id}')" title="${top}${bot?' \u00b7 '+bot:''}">`
      +`<span class="fb-dot" style="background:${c.color}"></span>`
      +`<span class="fb-txt">${top}${bot?`<span class="fb-zh">${bot}</span>`:''}</span>`
      +`<span class="fb-cnt">${cnt}</span>`
      +`</button>`;
  }).join('');
}

function getRPCompanies(){
  return ALL_BOOTHS_DATA.filter(b => {
    if(rpFilter === 'competitor') return DCM[b.n] || ICM[b.n];
    if(rpFilter === 'ess_ev') return ESS_EV[b.n];
    if(rpFilter === 'available') return b.c === 'available' || b.nm.toLowerCase().startsWith('available');
    return b.c === rpFilter;
  }).filter(b => b.nm && !b.nm.startsWith('Available'));
}

function renderRPList(){
  // Special render for available booths
  if(rpFilter==='available'){
    renderAvailableList();
    return;
  }
  // Special render for chinese companies
  if(rpFilter==='chinese'){
    renderChineseList();
    return;
  }
  let companies = getRPCompanies();
  // Filter by search
  if(rpSearch){
    const q = rpSearch.toLowerCase();
    companies = companies.filter(b =>
      b.nm.toLowerCase().includes(q) ||
      (b.zh||'').toLowerCase().includes(q) ||
      b.n.toLowerCase().includes(q)
    );
  }
  // Sort alphabetically by English name (primary), zh name as tiebreaker
  companies.sort((a,b) => {
    const na = (a.zh||a.nm).toLowerCase();
    const nb = (b.zh||b.nm).toLowerCase();
    // Chinese companies: sort by zh; others by nm
    const isChinese = s => /[一-鿿]/.test(s);
    const ka = isChinese(a.zh||'') ? (a.zh||a.nm) : a.nm;
    const kb = isChinese(b.zh||'') ? (b.zh||b.nm) : b.nm;
    return ka.toLowerCase().localeCompare(kb.toLowerCase(), 'zh');
  });

  const total = getRPCompanies().length;
  const showing = companies.length;
  const countText = rpSearch ? `${showing} / ${total} 家` : `${total} 家公司`;

  let html = `<div style="padding:6px 12px;font-size:11px;color:#484f58;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center">
    <span>${countText} · 字母排序</span>
    ${rpSearch?`<span style="color:#58a6ff;cursor:pointer" onclick="clearRPSearch()">✕ 清除</span>`:''}
  </div>`;
  
  if(companies.length === 0){
    html += `<div style="padding:24px;text-align:center;color:#484f58;font-size:13px">没有匹配的公司</div>`;
  }

  companies.forEach(b => {

    html += `<div class="rp-company ${pClass} ${isSelected?'selected':''}" onclick="showRPDetail('${b.n}')">

            ${ic?'<span class="rp-tag" style="color:#f0883e;background:rgba(240,136,62,0.1)">⚡间接竞品</span>':''}

    'competitor':'⚔️ 竞争对手',
    'supplier':'🔧 上游供应商',
    'other':'📋 其他'
  };
  const roleColors={
    'direct_customer':'#ffa657',
    'customer':'#3fb950',
    'competitor':'#f85149',
    'supplier':'#a371f7',
    'other':'#484f58'
  };

  // Group by role, apply search filter
  const q=rpSearch.toLowerCase();
  const grouped={};
  CN_COMPANIES.forEach(c=>{
    if(q&&!c.zh.toLowerCase().includes(q)&&!c.name.toLowerCase().includes(q)&&!c.booth.includes(q))return;
    const r=c.role||'other';
    if(!grouped[r])grouped[r]=[];
    grouped[r].push(c);
  });

  const total=CN_COMPANIES.length;
  const showing=Object.values(grouped).flat().length;
  let html=`<div style="padding:6px 12px;font-size:11px;color:#484f58;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center">
    <span>${q?showing+' / '+total+' 家':'total ' +total+' 家'} · 按角色分类</span>
    ${q?`<span style="color:#58a6ff;cursor:pointer" onclick="clearRPSearch()">✕ 清除</span>`:''}
  </div>`;

  if(showing===0){
    html+=`<div style="padding:24px;text-align:center;color:#484f58;font-size:13px">没有匹配的公司</div>`;
  }

  roleOrder.forEach(role=>{
    const list=grouped[role];
    if(!list||!list.length)return;
    const color=roleColors[role]||'#484f58';
    html+=`<div style="padding:5px 12px;font-size:11px;font-weight:600;color:${color};background:${color}15;border-bottom:1px solid #21262d">${roleLabels[role]||role}(${list.length}）</div>`;
    list.forEach(c=>{
      const b=ALL_BOOTHS_DATA.find(x=>x.n===c.booth);
      const colorB=b?getColor(b):'#484f58';
      html+=`<div class="rp-company" style="border-left:3px solid ${color}" onclick="showRPDetail('${c.booth}')">
        <div style="display:flex;align-items:flex-start;justify-content:space-between">
          <div style="flex:1">
            <div><span class="rp-num">${c.booth}</span><span class="rp-name">${c.zh}</span></div>
            <div class="rp-zh">${c.name}</div>
            <div class="rp-tags">
              <span class="rp-tag" style="background:${color}22;color:${color}">${c.industry}</span>
            </div>
          </div>
          <span style="font-size:11px;color:#484f58;margin-left:8px;flex-shrink:0">›</span>
        </div>
      </div>`;
    });
  });

  html+='<div style="padding:10px 12px;border-top:1px solid #21262d">'
    +'<button onclick="downloadCompanyList()" style="width:100%;padding:7px;border-radius:8px;border:1px solid #30363d;background:#21262d;color:#e6edf3;cursor:pointer;font-size:12px">⬇ 下载公司列表 (.csv)</button>'
    +'</div>';
  document.getElementById('rp-body').innerHTML=html;
}

function renderAvailableList() {
  var q = rpSearch.toLowerCase();
  var list = AVAILABLE_RANKED.slice();
  if (q) list = list.filter(function(r) {
    return r.booth.indexOf(q) >= 0 || r.badge.toLowerCase().indexOf(q) >= 0 ||
           (r.location || '').toLowerCase().indexOf(q) >= 0;
  });
  var gradeColor = {Excellent: '#3fb950', Good: '#58a6ff', Fair: '#8b949e'};
  var h = '<div style="padding:6px 12px;font-size:11px;color:#484f58;border-bottom:1px solid #21262d;display:flex;justify-content:space-between;align-items:center">'
    + '<span>' + list.length + ' 个展位 · 综合评分排序</span>'
    + (q ? '<span style="color:#58a6ff;cursor:pointer" onclick="clearRPSearch()">✕ 清除</span>' : '')
    + '</div>';
  if (!list.length) {
    h += '<div style="padding:24px;text-align:center;color:#484f58;font-size:13px">没有匹配展位</div>';
  }
  list.forEach(function(r) {
    var gc = gradeColor[r.grade] || '#484f58';
    var barW = Math.round(r.score * 10);
    h += '<div class="rp-company" style="border-left:3px solid ' + r.badgeColor + '" onclick="showAvailableDetail(\'' + r.booth + '\')">'
      + '<div style="display:flex;align-items:flex-start;gap:8px">'
      + '<div style="flex:1;min-width:0">'
      + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:3px;flex-wrap:wrap">'
      + '<span style="font-size:14px;font-weight:700;color:#e6edf3">展位 ' + r.booth + '</span>'
      + '<span style="font-size:10px;padding:1px 7px;border-radius:8px;background:' + r.badgeColor + '22;color:' + r.badgeColor + '">' + r.badge + '</span>'
      + '</div>'
      + '<div style="display:flex;align-items:center;gap:6px;margin-bottom:4px">'
      + '<div style="flex:1;height:4px;background:#21262d;border-radius:2px;overflow:hidden">'
      + '<div style="width:' + barW + '%;height:100%;background:' + gc + ';border-radius:2px"></div></div>'
      + '<span style="font-size:13px;font-weight:700;color:' + gc + '">' + r.score.toFixed(1) + '</span>'
      + '<span style="font-size:10px;color:' + gc + '">' + r.grade + '</span>'
      + '</div>'
      + '<div style="font-size:10px;color:#8b949e;margin-bottom:3px">' + (r.size || '') + '</div>'
      + '<div style="font-size:11px;color:#c9d1d9;line-height:1.5">' + (r.verdict || '').slice(0, 70) + (r.verdict && r.verdict.length > 70 ? '...' : '') + '</div>'
      + '</div>'
      + '<span style="font-size:18px;flex-shrink:0">&rsaquo;</span>'
      + '</div></div>';
  });
  h += '<div style="padding:10px 12px;border-top:1px solid #21262d">'
    + '<button onclick="downloadAvailableList()" style="width:100%;padding:7px;border-radius:8px;border:1px solid #30363d;background:#21262d;color:#e6edf3;cursor:pointer;font-size:12px">&#8595; 下载可用展位分析 (.csv)</button>'
    + '</div>';
  document.getElementById('rp-body').innerHTML = h;
}

function buildBoothDetail(r) {
  var gradeColor = {Excellent: '#3fb950', Good: '#58a6ff', Fair: '#8b949e'};
  var gc = gradeColor[r.grade] || '#484f58';
  var barW = Math.round(r.score * 10);

  function scoreBar(label, val) {
    var pct = Math.round(val * 10);
    var c = pct >= 80 ? '#3fb950' : pct >= 60 ? '#58a6ff' : pct >= 40 ? '#ffa657' : '#8b949e';
    return '<div style="margin-bottom:6px">'
      + '<div style="display:flex;justify-content:space-between;font-size:11px;margin-bottom:2px">'
      + '<span style="color:#8b949e">' + label + '</span>'
      + '<span style="color:' + c + ';font-weight:600">' + val.toFixed(1) + '/10</span>'
      + '</div>'
      + '<div style="height:3px;background:#21262d;border-radius:2px">'
      + '<div style="width:' + pct + '%;height:100%;background:' + c + ';border-radius:2px"></div>'
      + '</div></div>';
  }

  var prosHtml = (r.pros || []).map(function(p) {
    return '<div style="font-size:11px;color:#c9d1d9;margin-bottom:3px;line-height:1.5">&bull; ' + p + '</div>';
  }).join('');
  var consHtml = (r.cons || []).map(function(c) {
    return '<div style="font-size:11px;color:#c9d1d9;margin-bottom:3px;line-height:1.5">&bull; ' + c + '</div>';
  }).join('');
  var otherBooths = AVAILABLE_RANKED.filter(function(x) {
    return x.booth !== r.booth && x.score >= 4;
  }).map(function(x) {
    var xgc = {Excellent: '#3fb950', Good: '#58a6ff', Fair: '#8b949e'}[x.grade] || '#484f58';
    return '<div onclick="showAvailableDetail(\'' + x.booth + '\')" style="display:flex;align-items:center;gap:8px;padding:5px 8px;border-radius:6px;cursor:pointer;background:#0d1117;border:1px solid #21262d;margin-bottom:3px">'
      + '<span style="font-size:12px;font-weight:600;color:#e6edf3;min-width:36px">' + x.booth + '</span>'
      + '<div style="flex:1;height:3px;background:#21262d;border-radius:2px">'
      + '<div style="width:' + Math.round(x.score * 10) + '%;height:100%;background:' + xgc + ';border-radius:2px"></div></div>'
      + '<span style="font-size:12px;font-weight:700;color:' + xgc + ';min-width:28px">' + x.score.toFixed(1) + '</span>'
      + '<span style="font-size:10px;color:#484f58;text-align:right">' + x.badge + '</span>'
      + '</div>';
  }).join('');

  return '<div style="padding:14px 14px 0">'
    + '<div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap">'
    + '<div><div style="font-size:28px;font-weight:800;color:' + gc + '">' + r.score.toFixed(1)
    + '<span style="font-size:13px;color:#484f58">/10</span></div>'
    + '<div style="font-size:11px;color:' + gc + ';font-weight:600">' + r.grade + '</div></div>'
    + '<div style="flex:1"><div style="height:8px;background:#21262d;border-radius:4px;overflow:hidden;margin-bottom:5px">'
    + '<div style="width:' + barW + '%;height:100%;background:' + gc + ';border-radius:4px"></div></div>'
    + '<span style="font-size:12px;font-weight:600;padding:3px 10px;border-radius:10px;background:' + r.badgeColor + '33;color:' + r.badgeColor + '">' + r.badge + '</span>'
    + '</div></div>'
    + '<div style="font-size:12px;color:#8b949e;margin-bottom:12px">&#9618; ' + (r.size || '') + ' &nbsp;&middot;&nbsp; &#9679; ' + (r.location || '') + '</div>'
    + '<div style="background:#0d1117;border-radius:8px;padding:12px;margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:#484f58;text-transform:uppercase;margin-bottom:8px">评分细项</div>'
    + scoreBar('&#128694; 人流量 & 交通动线', r.traffic_score || 5)
    + scoreBar('&#127970; 锚定展商质量', r.anchor_score || 5)
    + scoreBar('&#128065; 可见性 & 品牌曝光', r.visibility_score || 5)
    + scoreBar('&#127919; 思客琦相关性', r.skeqi_relevance || 5)
    + '</div>'
    + '<div style="margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:5px">人流量 & 动线分析</div>'
    + '<div style="font-size:12px;color:#c9d1d9;line-height:1.7;background:#21262d;border-radius:6px;padding:9px 10px">' + (r.traffic_analysis || '') + '</div>'
    + '</div>'
    + '<div style="margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:5px">周边锚定展商</div>'
    + '<div style="font-size:12px;color:#c9d1d9;line-height:1.8;background:#21262d;border-radius:6px;padding:9px 10px">' + (r.anchor_analysis || '').replace(/\n/g, '<br>') + '</div>'
    + '</div>'
    + '<div style="margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:5px">可见性 & 曝光度</div>'
    + '<div style="font-size:12px;color:#c9d1d9;line-height:1.7;background:#21262d;border-radius:6px;padding:9px 10px">' + (r.visibility_analysis || '') + '</div>'
    + '</div>'
    + '<div style="margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:#8b949e;text-transform:uppercase;margin-bottom:5px">对思客琦的战略价值</div>'
    + '<div style="font-size:12px;color:#c9d1d9;line-height:1.7;background:rgba(255,166,87,0.08);border-radius:6px;padding:9px 10px;border-left:2px solid #ffa657">' + (r.relevance_analysis || r.skeqi_relevance_analysis || '') + '</div>'
    + '</div>'
    + '<div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px">'
    + '<div><div style="font-size:10px;font-weight:600;color:#3fb950;margin-bottom:5px;text-transform:uppercase">优势</div>' + prosHtml + '</div>'
    + '<div><div style="font-size:10px;font-weight:600;color:#f0883e;margin-bottom:5px;text-transform:uppercase">劣势</div>' + consHtml + '</div>'
    + '</div>'
    + '<div style="border-left:3px solid ' + r.badgeColor + ';padding:10px 12px;background:#21262d;border-radius:0 8px 8px 0;margin-bottom:12px">'
    + '<div style="font-size:10px;font-weight:600;color:' + r.badgeColor + ';margin-bottom:4px;text-transform:uppercase">综合建议</div>'
    + '<div style="font-size:13px;font-weight:600;color:#e6edf3;line-height:1.6">' + (r.verdict || '') + '</div>'
    + '</div>'
    + (r.expand_notes ? '<div style="font-size:11px;color:#8b949e;padding:6px 10px;background:#0d1117;border-radius:6px;margin-bottom:12px">扩展方案: ' + r.expand_notes + '</div>' : '')
    + '<button onclick="jumpTo(\'' + r.booth + '\')" style="width:100%;padding:8px;border-radius:8px;border:1px solid #30363d;background:#21262d;color:#e6edf3;cursor:pointer;font-size:12px;margin-bottom:12px">&#128506; 在地图上定位展位 ' + r.booth + '</button>'
    + '<div style="font-size:11px;color:#484f58;margin-bottom:6px">快速对比其他展位:</div>'
    + otherBooths
    + '</div>';
}

function showAvailableDetail(boothNum) {
  var r = AVAILABLE_RANKED.find(function(x) { return x.booth === boothNum; });
  if (!r) return;
  jumpTo(boothNum);
  var backBtn = '<div style="padding:8px 12px;border-bottom:1px solid #21262d">'
    + '<button onclick="renderAvailableList()" style="border:none;background:none;cursor:pointer;color:#8b949e;font-size:12px">&#8592; 返回可用展位列表</button></div>';
  document.getElementById('rp-body').innerHTML = backBtn + '<div>' + buildBoothDetail(r) + '</div>';
}

function downloadAvailableList() {
  var rows = [['展位号','综合评分','等级','推荐标签','面积','位置','人流分','锚点分','可见分','相关分','综合建议']];
  AVAILABLE_RANKED.forEach(function(r) {
    rows.push([r.booth, r.score, r.grade, r.badge, r.size || '', r.location || '',
      r.traffic_score || '', r.anchor_score || '', r.visibility_score || '', r.skeqi_relevance || '',
      (r.verdict || '').replace(/"/g, "'")]);
  });
  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c || '').replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var uri = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
  var a = document.createElement('a');
  a.href = uri;
  a.download = 'Battery_Show_2026_Available_Booths.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

function downloadCompanyList() {
  if (rpFilter === 'available') { downloadAvailableList(); return; }
  if (rpFilter === 'chinese') {
    var q = rpSearch.toLowerCase();
    var list = CN_COMPANIES.filter(function(c) {
      if (!q) return true;
      return c.zh.toLowerCase().indexOf(q) >= 0 || c.name.toLowerCase().indexOf(q) >= 0 || c.booth.indexOf(q) >= 0;
    });
    var rows = [['展位号','中文名','英文名','行业','角色']];
    list.forEach(function(c) { rows.push([c.booth, c.zh, c.name, c.industry, c.role]); });
    var csv = rows.map(function(r) {
      return r.map(function(c) { return '"' + String(c || '').replace(/"/g, '""') + '"'; }).join(',');
    }).join('\n');
    var uri = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
  var a = document.createElement('a');
  a.href = uri;
  a.download = 'Battery_Show_2026_Chinese_Companies.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
    return;
  }
  var companies = getRPCompanies();
  var q = rpSearch.toLowerCase();
  if (q) companies = companies.filter(function(b) {
    return b.nm.toLowerCase().indexOf(q) >= 0 || (b.zh || '').toLowerCase().indexOf(q) >= 0 || b.n.indexOf(q) >= 0;
  });
  companies.sort(function(a, b) {
    var ka = (a.zh && /[\u4e00-\u9fff]/.test(a.zh)) ? a.zh : a.nm;
    var kb = (b.zh && /[\u4e00-\u9fff]/.test(b.zh)) ? b.zh : b.nm;
    return ka.toLowerCase().localeCompare(kb.toLowerCase(), 'zh');
  });
  var catLabels = {all:'全部',competitor:'竞争对手',ess_ev:'ESS/EV项目',customer:'目标客户',
    chinese:'中国企业',line:'产线设备',mfg:'制造设备',test:'测试检测',cert:'认证机构',
    elec:'电子连接',batmat:'电池材料',recycle:'回收安全',gov:'政府',other:'其他'};
  var cat = catLabels[rpFilter] || rpFilter;
  var rows = [['展位号','英文名','中文名','类别','优先级','行业细分','公司背景','切入机会','制造地点','联系建议']];
  companies.forEach(function(b) {
    var db = COMPANY_DB[b.n] || {};
    var ev = ESS_EV[b.n] || {};
    var dc = DCM[b.n] ? '直接竞品' : '';
    var ic = ICM[b.n] ? '间接竞品' : '';
    var catLabel = dc || ic || (ev.reason ? 'ESS/EV项目' : '') || (catLabels[b.c] || b.c);
    rows.push([b.n, b.nm, b.zh || '', catLabel,
      db.priority_label || '', (db.segment || []).join('|'),
      (db.background || b.intro || '').slice(0, 200),
      (db.opportunity || ev.reason || '').slice(0, 200),
      db.locations || '', db.contacts || '']);
  });
  var csv = rows.map(function(r) {
    return r.map(function(c) { return '"' + String(c || '').replace(/"/g, '""') + '"'; }).join(',');
  }).join('\n');
  var uri = 'data:text/csv;charset=utf-8,' + encodeURIComponent('\uFEFF' + csv);
  var a = document.createElement('a');
  a.href = uri;
  a.download = 'Battery_Show_2026_' + cat + '.csv';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
}

// Light/Dark Mode
function applyTheme(isLight){
  document.body.classList.toggle('light',isLight);
  var btn=document.getElementById('theme-btn');
  if(btn)btn.textContent=isLight?'🌙 Dark':'☀️ Light';
  if(typeof draw==='function')draw();
}
function toggleTheme(){
  var nowLight=!document.body.classList.contains('light');
  try{localStorage.setItem('tbsTheme',nowLight?'light':'dark');}catch(e){}
  applyTheme(nowLight);
}
